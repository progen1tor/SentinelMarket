<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cart.css">
    <title>Cart — Sentinel</title>
    <link rel="icon" type="image/png" href="favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicons/favicon.svg" />
    <link rel="shortcut icon" href="favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png" />
    <link rel="manifest" href="favicons/site.webmanifest" />
</head>

<body>
    <!-- хедлайн + навбар -->
    <header class="sentinel-header" id="sentinel-header">

        <!-- главный хедер вверху -->
        <h1 class="sentinel-heading">SENTINEL</h1>

        <!-- навбар -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-dark black-navbar">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Переключатель навигации">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <li class="nav-item me-5 custom-margin">
                            <a class="nav-link" href="cart.html"><img class="img-fluid active" id="shopping-cart"
                                    src="img/shopping-cart.svg" alt="shopping-cart" title="Перейти в корзину"></a>
                        </li>
                        <li class="nav-item me-5 custom-margin">
                            <a class="nav-link" aria-current="page" href="index.html">Главная</a>
                        </li>
                        <li class="nav-item me-5 custom-margin">
                            <a class="nav-link" href="catalog.html">Магазин</a>
                        </li>
                        <li class="nav-item me-5 custom-margin">
                            <a class="nav-link" href="leave-review.html">Оставить отзыв</a>
                        </li>
                        <li class="nav-item me-5 custom-margin">
                            <a class="nav-link" href="https://docs.google.com/document/d/1Q8ilpNiYS8Bm-1XsLSa6kfAyMpSe_cumKoAbiisHeFA/edit?usp=sharing" target="_blank">Использование кода</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Дополнительно
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="reviews.html">Посмотреть отзывы клиентов</a>
                                </li>
                                <li><a class="dropdown-item" href="https://progen1tor.github.io/Sentinel/" target="_blank" id="first-part">Перейти на первую часть
                                        проекта</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- корзина -->
    <section class="cart-section">

        <!-- карточка со стоимостью -->
        <div class="card price-data">
            <div class="card-header dark-header">
                Итоговая сумма заказа:<span class="space">&nbsp;</span><span id="sum"></span>
            </div>
            <div class="card-body">
                <h5 class="card-title your-order-title">Ваш заказ:</h5>
                <p class="card-text your-order-text" id="order-data"></p>
            </div>
        </div>
    </section>

    <!-- разделитель -->
    <span class="border-top divider"></span>

    <!-- форма для подтверждения заказа  -->
    <section class="form-section">

        <!-- заголовок формы -->
        <h2 class="form-header">ПОДТВЕРЖДЕНИЕ ЗАКАЗА</h2>

        <!-- бэкграунд формы -->
        <div class="form-bg">
            <!-- сама форма  -->
            <form action="https://yandex.com/search?" target="_blank">
                <!-- ФИО -->
                <div class="form-floating mb-4">
                    <input type="text" class="form-control form-input" id="name" name="name" value="Иван Иванов Иванович"
                        autocomplete="on">
                    <label for="name" class="larger-label">ФИО</label>
                </div>
                <!-- почта  -->
                <div class="form-floating mb-4">
                    <input type="email" class="form-control form-input" id="email" name="email" value="email@example.ru"
                        autocomplete="on">
                    <label for="email" class="larger-label">Адрес электронной почты</label>
                </div>
                <!-- номер телефона -->
                <div class="form-floating mb-4">
                    <input type="tel" class="form-control form-input" id="phone" name="phone" value="+7-910-986-13-13"
                        autocomplete="on">
                    <label for="phone" class="larger-label">Номер телефона</label>
                </div>
                <!-- адрес доставки  -->
                <div class="form-floating mb-4">
                    <input type="text" class="form-control form-input" id="address" name="address"
                        value="г. Москва, ул. Тверская, д. 15" autocomplete="on">
                    <label for="address" class="larger-label">Адрес доставки</label>
                </div>
                <!-- почтовый индекс  -->
                <div class="form-floating mb-4">
                    <input type="number" class="form-control form-input" id="postal-code" name="postal-code" value="125009"
                        autocomplete="on">
                    <label for="postal-code" class="larger-label">Почтовый индекс</label>
                </div>
                <!-- тип доставки  -->
                <div class="form-floating-imitation" id="form-floating-imitation">
                    <label class="form-label">Тип доставки</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="delivery-type" id="standart" value="standart"
                            checked>
                        <label class="form-check-label" for="standart">
                            Стандартная доставка
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="delivery-type" id="express" value="express">
                        <label class="form-check-label" for="express">
                            Экспресс-доставка
                        </label>
                    </div>
                </div>
                <!-- кнопка подтверждения -->
                <input type="submit" class="btn btn-primary custom-btn-submit" value="Подтвердить заказ">
            </form>
        </div>
    </section>

     <!-- футер главной страницы -->
    <footer class="footer-black text-white py-4">

        <!-- первая часть футера: якорь наверх и соцсети -->
        <div class="first-footer-part">

            <!-- наверх  -->
            <div class="go-up">
                <a href="#sentinel-header" title="Наверх">⏏</a>
            </div>

            <!-- соцсети -->
            <div class="social">
                <a href="mailto:akmn140@gmail.com" target="_blank"><i class="bi bi-person-circle footer-icon"></i></a>
                <a href="https://github.com/progen1tor" target="_blank"><i class="bi bi-github footer-icon"></i></a>
                <a href="https://t.me/ob1101" target="_blank"><i class="bi bi-telegram footer-icon"></i></a>
            </div>
        </div>

        <span class="border-top footer-divider"></span>

        <!-- вторая часть футера: лицензия  -->
        <div class="sec-footer-part">
            <a href="https://docs.google.com/document/d/1ztQ5R3w9ewzbD-YblNddGogWkwsDoaPU1uzVj_aNad0/edit?usp=sharing" target="_blank">© 2025, Sentinel.</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <script src="js/cart.js"></script>
    <script src="js/device-test.js"></script>
</body>
</html>
